name: hollowmere_files
description: "The Hollowmere Files - a found-phone interactive mystery."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  shared_preferences: ^2.3.0
  just_audio: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/img/portraits/
    - assets/img/locations/
    - assets/img/evidence/
    - assets/img/key/
    - assets/audio/
    - assets/story/
    - assets/l10n/
